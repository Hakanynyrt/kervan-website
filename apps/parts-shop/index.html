<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Theme picked by hand (header "Tema") wins over the sun; applied before paint. Keep the
      // key and the colours in sync with src/components/ThemeSelect.tsx and globals.css.
      (function () {
        var h = document.documentElement;
        try {
          var t = localStorage.getItem('kv_theme');
          if (t === 'dark' || t === 'light') h.setAttribute('data-theme', t);
        } catch (e) {
          /* storage blocked: the sun decides */
        }
        var dark =
          h.getAttribute('data-theme') === 'dark' ||
          (h.getAttribute('data-theme') !== 'light' &&
            (h.getAttribute('data-sun') === 'night' ||
              (!h.hasAttribute('data-sun') &&
                window.matchMedia('(prefers-color-scheme: dark)').matches)));
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#1c1f23' : '#FFFFFF');
      })();
      // Home opening (src/components/ExplodedPicker.tsx): once per session, for visitors without
      // reduced motion; the component clears the mark, and this timer does if it never runs.
      (function () {
        var h = document.documentElement;
        try {
          if (
            /^\/(en\/?)?$/.test(location.pathname) &&
            !navigator.webdriver &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
            !sessionStorage.getItem('kv_open_played')
          ) {
            h.setAttribute('data-kv-open', '1');
            setTimeout(function () {
              if (!window.__kvOpen) h.removeAttribute('data-kv-open');
            }, 6000);
          }
        } catch (e) {
          /* storage blocked: no opening */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Title, meta and the page props script are written per page by scripts/prerender.mjs. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
