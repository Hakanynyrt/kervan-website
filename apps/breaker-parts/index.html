<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kervan Breaker — Hidrolik kırıcı yedek parçaları</title>
    <meta
      name="description"
      content="Keski, piston, burç, sızdırmazlık. 2004'ten beri Kocaeli'de üretiliyor. 40+ kırıcı markası uyumlu."
    />
    <meta name="theme-color" content="#0A0A0B" />
    <script>
      // Light by day, dark at night: the edge middleware (functions/_middleware.ts) sets
      // data-sun = day | night on the html element; a theme picked by hand (header "Tema", localStorage
      // kv_theme) wins and is applied here before paint. No mark ⇒ the dark (night) look. Keep
      // the key and the colours in sync with @kervan/ui ThemeSelect and src/styles/globals.css.
      (function () {
        var h = document.documentElement;
        try {
          var t = localStorage.getItem('kv_theme');
          if (t === 'dark' || t === 'light') h.setAttribute('data-theme', t);
        } catch (e) {
          /* storage blocked: the sun decides */
        }
        var light =
          h.getAttribute('data-theme') === 'light' ||
          (h.getAttribute('data-theme') !== 'dark' && h.getAttribute('data-sun') === 'day');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', light ? '#F6F3EE' : '#0A0A0B');
      })();
    </script>

    <link
      rel="preload"
      href="/fonts/fraunces-latin-v38.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-v20.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-02.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-02.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-02.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-02.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kervan Breaker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD are
         written per page by scripts/prerender.mjs (src/lib/page-meta.ts). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
