# Keeps the SHA-pinned GitHub Actions in .github/workflows/ up to date.
# Dependabot opens a PR per update with the new commit SHA and version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
