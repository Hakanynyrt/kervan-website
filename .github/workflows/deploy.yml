name: Deploy

# Push to main → production deploy of BOTH apps.
# PRs → preview deploy (Cloudflare Pages branch deploys) of the apps whose
#   source changed (`paths-filter`; `packages/**` etc. → both).
# Manual "Run workflow" → redeploy one or both apps from the chosen branch
#   (main = production), e.g. after changing a Pages env var. No dummy commits.
#
# Every deploy waits for `verify` (typecheck + lint). Production deploys are
# followed by the smoke probe in .github/scripts/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [both, heat-treatment, breaker-parts]
        default: both

# PR runs supersede each other. main/dispatch runs are never cancelled
# mid-deploy; a newer queued run can still replace an older *pending* one,
# which is why every push to main deploys both apps instead of relying on
# the per-push paths filter.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed apps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      heat-treatment: ${{ steps.filter.outputs.heat-treatment }}
      breaker-parts: ${{ steps.filter.outputs.breaker-parts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Root public/ paths: the apps symlink these into their own public/.
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            heat-treatment:
              - *shared
              - 'apps/heat-treatment/**'
              - 'public/photos/**'
              - 'public/videos/**'
            breaker-parts:
              - *shared
              - 'apps/breaker-parts/**'
              - 'public/videos/**'
              - 'public/kirici-uc.glb'

  verify:
    name: Typecheck + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  deploy-heat-treatment:
    name: kervanheat.com
    needs: [changes, verify]
    # Fork PRs get no secrets, so they only run verify.
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.app != 'breaker-parts') ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.heat-treatment == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build heat-treatment
        run: pnpm turbo build --filter=@kervan/heat-treatment

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app directory so functions/ is auto-detected at
          # apps/heat-treatment/functions (Pages Functions live next to dist).
          workingDirectory: apps/heat-treatment
          command: >-
            pages deploy dist
            --project-name=kervan-heat-treatment
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-breaker-parts:
    name: kervanbreaker.com
    needs: [changes, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.app != 'heat-treatment') ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.breaker-parts == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build breaker-parts
        run: pnpm turbo build --filter=@kervan/breaker-parts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/breaker-parts
          command: >-
            pages deploy dist
            --project-name=kervan-breaker-parts
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  smoke:
    name: Production smoke test
    needs: [deploy-heat-treatment, deploy-breaker-parts]
    # Only after a production deploy (main), and only if no deploy failed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Smoke probe (GET/OPTIONS only)
        run: bash .github/scripts/smoke.sh
