name: Deploy

# Push to main → production deploy of ALL apps (heat-treatment, breaker-parts, parts-shop).
# PRs → preview deploy (Cloudflare Pages branch deploys) of the apps whose
#   source changed (`paths-filter`; `packages/**` etc. → both).
# Manual "Run workflow" → redeploy apps from the chosen branch (both = heat + breaker,
#   all = + parts-shop)
#   (main = production), e.g. after changing a Pages env var. No dummy commits.
#
# Every deploy waits for `verify` (typecheck + lint + format). Production deploys are
# followed by the smoke probe in .github/scripts/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [both, heat-treatment, breaker-parts, parts-shop, all]
        default: both

# PR runs supersede each other. main/dispatch runs are never cancelled
# mid-deploy; a newer queued run can still replace an older *pending* one,
# which is why every push to main deploys every app instead of relying on
# the per-push paths filter.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed apps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      heat-treatment: ${{ steps.filter.outputs.heat-treatment }}
      breaker-parts: ${{ steps.filter.outputs.breaker-parts }}
      parts-shop: ${{ steps.filter.outputs.parts-shop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Root public/ paths: the apps symlink these into their own public/.
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            heat-treatment:
              - *shared
              - 'apps/heat-treatment/**'
              - 'public/photos/**'
              - 'public/videos/**'
            breaker-parts:
              - *shared
              - 'apps/breaker-parts/**'
              - 'public/videos/**'
              - 'public/kirici-uc.glb'
            parts-shop:
              - *shared
              - 'apps/parts-shop/**'

  verify:
    name: Typecheck + lint + format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  deploy-heat-treatment:
    name: kervanheat.com
    needs: [changes, verify]
    # Fork PRs and Dependabot-triggered runs get no Actions secrets
    # (CLOUDFLARE_API_TOKEN), so they only run verify.
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","all","heat-treatment"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.heat-treatment == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the prerender reads each page's last commit date
          # (git log) for the sitemap <lastmod>.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build heat-treatment
        run: pnpm turbo build --filter=@kervan/heat-treatment

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app directory so functions/ is auto-detected at
          # apps/heat-treatment/functions (Pages Functions live next to dist).
          workingDirectory: apps/heat-treatment
          command: >-
            pages deploy dist
            --project-name=kervan-heat-treatment
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-breaker-parts:
    name: kervanbreaker.com
    needs: [changes, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","all","breaker-parts"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.breaker-parts == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the prerender reads each page's last commit date
          # (git log) for the sitemap <lastmod>.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build breaker-parts
        run: pnpm turbo build --filter=@kervan/breaker-parts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/breaker-parts
          command: >-
            pages deploy dist
            --project-name=kervan-breaker-parts
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-parts-shop:
    name: magaza.kervanbreaker.com
    needs: [changes, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","parts-shop"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.parts-shop == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    # The first full render (~5,400 images) is spread over runs by a time budget (best-sellers
    # first); later runs only render changes.
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Public fields of published rows only (toPublicCatalog); prints counts only.
      # Without the data token → DEMO catalog, unless SHOP_REQUIRE_CATALOG=1 (main).
      - name: Catalog snapshot from D1
        env:
          SHOP_D1: kervan-shop
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SHOP_DATA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOP_REQUIRE_CATALOG: ${{ github.ref == 'refs/heads/main' && vars.SHOP_REQUIRE_CATALOG || '0' }}
        run: node --experimental-strip-types --no-warnings apps/parts-shop/scripts/build-catalog.ts

      # Renders are content-addressed (file name = hash of the geometry and RENDER_VERSION),
      # so every cached file stays valid; only new or changed tips are rendered.
      - name: Restore tip renders
        uses: actions/cache/restore@v4
        with:
          path: apps/parts-shop/.renders
          key: shop-renders-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shop-renders-

      - name: Install Chromium for the renderer
        run: pnpm --filter @kervan/parts-shop exec playwright install --with-deps chromium

      # Stops starting new renders after the budget; tips without images yet get them next run.
      - name: Render tips
        env:
          SHOP_RENDER_WORKERS: '4'
          SHOP_RENDER_BUDGET_MIN: '80'
        run: node --experimental-strip-types --no-warnings apps/parts-shop/scripts/render-tips.ts

      # Saved even when a later step fails, so finished renders are never lost.
      - name: Save tip renders
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/parts-shop/.renders
          key: shop-renders-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build parts-shop
        run: pnpm turbo build --filter=@kervan/parts-shop

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/parts-shop
          command: >-
            pages deploy dist
            --project-name=kervan-parts-shop
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  smoke:
    name: Production smoke test
    needs: [deploy-heat-treatment, deploy-breaker-parts, deploy-parts-shop]
    # Only after a production deploy (main), and only if no deploy failed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Smoke probe (GET/OPTIONS only)
        run: bash .github/scripts/smoke.sh
