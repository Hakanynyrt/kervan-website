name: Deploy

# Push to main → production deploy.
# PRs and other branches → preview deploy (Cloudflare Pages branch deploys).
#
# Each app deploys independently — `paths-filter` detects which app's source
# (or shared package) changed. If only `apps/heat-treatment/**` changed,
# only kervanheat.com redeploys; both deploy when `packages/**` changes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      heat-treatment: ${{ steps.filter.outputs.heat-treatment }}
      breaker-parts: ${{ steps.filter.outputs.breaker-parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            heat-treatment:
              - 'apps/heat-treatment/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            breaker-parts:
              - 'apps/breaker-parts/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/deploy.yml'

  deploy-heat-treatment:
    name: kervanheat.com
    needs: changes
    if: needs.changes.outputs.heat-treatment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build heat-treatment
        run: pnpm turbo build --filter=@kervan/heat-treatment

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app directory so functions/ is auto-detected at
          # apps/heat-treatment/functions (Pages Functions live next to dist).
          workingDirectory: apps/heat-treatment
          command: >-
            pages deploy dist
            --project-name=kervan-heat-treatment
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-breaker-parts:
    name: kervanbreaker.com
    needs: changes
    if: needs.changes.outputs.breaker-parts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build breaker-parts
        run: pnpm turbo build --filter=@kervan/breaker-parts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/breaker-parts
          command: >-
            pages deploy dist
            --project-name=kervan-breaker-parts
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
