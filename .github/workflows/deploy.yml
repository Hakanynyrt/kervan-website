name: Deploy Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'legacy-astro/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install (root)
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Install (site_v2)
        run: npm install --no-audit --no-fund --prefer-offline
        working-directory: site_v2

      - name: Build site_v2 (Vite)
        run: npm run build
        working-directory: site_v2

      # Merge v1 inner pages (kvkk, about, blog, vs.) + their static deps
      # (kit.css, dict.jsx, etc.) into the Vite dist directory.
      # Excluded: index.html (v2 owns root), assets/ (Vite chunks), photos/
      # and videos/ (already symlinked through site_v2/public/), and any
      # files prefixed with `_` like `_headers` (CF reserved).
      - name: Merge v1 inner pages into dist
        run: |
          rsync -av \
            --exclude index.html \
            --exclude catalog.html \
            --exclude assets \
            --exclude photos \
            --exclude videos \
            --exclude '_*' \
            public/ site_v2/dist/

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
