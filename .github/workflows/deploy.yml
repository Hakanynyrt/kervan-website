name: Deploy

# Push to main → production deploy of ALL apps (heat-treatment, breaker-parts, parts-shop).
# PRs → preview deploy (Cloudflare Pages branch deploys) of the apps whose
#   source changed (`paths-filter`; `packages/**` etc. → both).
# Manual "Run workflow" → redeploy apps from the chosen branch (both = heat + breaker,
#   all = + parts-shop)
#   (main = production), e.g. after changing a Pages env var. No dummy commits.
#
# Every deploy waits for `verify` (typecheck + lint + format). Production deploys are
# followed by the smoke probe in .github/scripts/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        type: choice
        options: [both, heat-treatment, breaker-parts, parts-shop, all]
        default: both

# PR runs supersede each other. main/dispatch runs are never cancelled
# mid-deploy; a newer queued run can still replace an older *pending* one,
# which is why every push to main deploys every app instead of relying on
# the per-push paths filter.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed apps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      heat-treatment: ${{ steps.filter.outputs.heat-treatment }}
      breaker-parts: ${{ steps.filter.outputs.breaker-parts }}
      parts-shop: ${{ steps.filter.outputs.parts-shop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Root public/ paths: the apps symlink these into their own public/.
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            heat-treatment:
              - *shared
              - 'apps/heat-treatment/**'
              - 'public/photos/**'
              - 'public/videos/**'
            breaker-parts:
              - *shared
              - 'apps/breaker-parts/**'
              - 'public/videos/**'
              - 'public/kirici-uc.glb'
            parts-shop:
              - *shared
              - 'apps/parts-shop/**'

  verify:
    name: Typecheck + lint + format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The repo and its CI logs are public: refuse price sheets, the sheet key, drawings,
      # VEGA numbers and tokens in the pushed commits (scripts/secret-guard.mjs; it prints
      # file, line and rule only, never the matched text).
      - name: Secret guard
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node --test scripts/secret-guard.test.mjs
          if [ "$EVENT" = pull_request ]; then
            node scripts/secret-guard.mjs "$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            node scripts/secret-guard.mjs "$PUSH_BEFORE..$GITHUB_SHA"
          else
            node scripts/secret-guard.mjs "HEAD~1..HEAD"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

  deploy-heat-treatment:
    name: kervanheat.com
    needs: [changes, verify]
    # Fork PRs and Dependabot-triggered runs get no Actions secrets
    # (CLOUDFLARE_API_TOKEN), so they only run verify.
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","all","heat-treatment"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.heat-treatment == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the prerender reads each page's last commit date
          # (git log) for the sitemap <lastmod>.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build heat-treatment
        run: pnpm turbo build --filter=@kervan/heat-treatment

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app directory so functions/ is auto-detected at
          # apps/heat-treatment/functions (Pages Functions live next to dist).
          workingDirectory: apps/heat-treatment
          command: >-
            pages deploy dist
            --project-name=kervan-heat-treatment
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-breaker-parts:
    name: kervanbreaker.com
    needs: [changes, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","all","breaker-parts"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.breaker-parts == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the prerender reads each page's last commit date
          # (git log) for the sitemap <lastmod>.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build breaker-parts
        run: pnpm turbo build --filter=@kervan/breaker-parts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/breaker-parts
          command: >-
            pages deploy dist
            --project-name=kervan-breaker-parts
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  deploy-parts-shop:
    name: kiriciparca.com
    needs: [changes, verify]
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","parts-shop"]'), inputs.app)) ||
        (github.event_name == 'pull_request' &&
          needs.changes.outputs.parts-shop == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-24.04
    # The first full render (~5,400 images) is spread over runs by a time budget (best-sellers
    # first); later runs only render changes.
    timeout-minutes: 120
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Public fields of published rows only (toPublicCatalog); prints counts only.
      # Without the data token → DEMO catalog, unless SHOP_REQUIRE_CATALOG=1 (main).
      - name: Catalog snapshot from D1
        env:
          SHOP_D1: kervan-shop
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SHOP_DATA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOP_REQUIRE_CATALOG: ${{ github.ref == 'refs/heads/main' && vars.SHOP_REQUIRE_CATALOG || '0' }}
        run: node --experimental-strip-types --no-warnings apps/parts-shop/scripts/build-catalog.ts

      # Renders are content-addressed (file name = hash of the geometry and RENDER_VERSION),
      # so every cached file stays valid; only new or changed tips are rendered.
      - name: Restore tip renders
        uses: actions/cache/restore@v4
        with:
          path: apps/parts-shop/.renders
          key: shop-renders-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shop-renders-

      - name: Install Chromium for the renderer
        run: pnpm --filter @kervan/parts-shop exec playwright install --with-deps chromium

      # Stops starting new renders after the budget; tips without images yet get them next run.
      - name: Render tips
        env:
          SHOP_RENDER_WORKERS: '4'
          SHOP_RENDER_BUDGET_MIN: '80'
        run: node --experimental-strip-types --no-warnings apps/parts-shop/scripts/render-tips.ts

      # Saved even when a later step fails, so finished renders are never lost.
      - name: Save tip renders
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/parts-shop/.renders
          key: shop-renders-${{ github.run_id }}-${{ github.run_attempt }}

      # Tip images live in R2 (img.kiriciparca.com), outside Pages' 20,000-file limit. Production
      # only, and only when both R2 keys exist; previews and PRs keep /tips inside dist.
      - name: R2 for tip images
        id: r2
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -z "$R2_KEY" ] || [ -z "$R2_SECRET" ]; then
              echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY missing on main: the tip images need R2 (Pages file limit)"
              exit 1
            fi
            echo "base=https://img.kiriciparca.com" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build parts-shop
        env:
          VITE_TIP_IMG_BASE: ${{ steps.r2.outputs.base }}
        run: pnpm turbo build --filter=@kervan/parts-shop

      # Additive only (never --delete): published names are content-addressed, so a name never
      # changes meaning. Uploads exactly the images the built pages reference and are missing from
      # the bucket, then proves every one is there. Only public tip renders (<key>-md-<PUB>.webp)
      # may go to the public bucket. Fails closed: if anything below fails, the deploy does not
      # run and production keeps the previous site.
      - name: Upload tip images to R2
        if: steps.r2.outputs.base != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli >= 2.23 adds CRC checksums R2 does not take; only send them when required.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: kervan-renders
          R2_BASE: ${{ steps.r2.outputs.base }}
        run: |
          set -euo pipefail
          aws --version
          PUB=apps/parts-shop/.renders/pub
          DIST=apps/parts-shop/dist
          PUBV=$(sed -n "s/^const PUB = '\(.*\)';.*/\1/p" apps/parts-shop/scripts/prerender.mjs)
          [ -n "$PUBV" ] || { echo "PUB version not found in prerender.mjs"; exit 1; }
          # Every image the pages use: absolute URLs in the HTML and the keys in the page props.
          {
            grep -rhoE 'img\.kiriciparca\.com/tips/[A-Za-z0-9._-]+\.webp' "$DIST" --include='*.html' | sed 's#.*/tips/##' || true
            grep -rhoE '"image(Side|Rear)?":"[A-Za-z0-9]+"' "$DIST" --include='*.html' | sed -E 's/.*:"//; s/"$//; s/$/-md-'"$PUBV"'.webp/' || true
          } | sort -u > refs.txt
          echo "images the pages use: $(wc -l < refs.txt)"
          bad=$(grep -Ev "^[A-Za-z0-9]+-md-${PUBV}\.webp$" refs.txt || true)
          if [ -n "$bad" ]; then echo "unexpected image names referenced: $(echo "$bad" | wc -l)"; exit 1; fi
          list_bucket() {
            aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix tips/ --endpoint-url "$R2_ENDPOINT" \
              --query 'Contents[].Key' --output text | tr '\t' '\n' | sed 's#^tips/##' | grep -v '^None$' | sort -u > "$1" || true
          }
          list_bucket have.txt
          comm -23 refs.txt have.txt > missing.txt
          echo "missing in the bucket: $(wc -l < missing.txt)"
          while read -r f; do
            [ -f "$PUB/$f" ] || { echo "page uses an image with no local render: $f"; exit 1; }
          done < missing.txt
          if [ -s missing.txt ]; then
            export PUB R2_BUCKET R2_ENDPOINT
            xargs -a missing.txt -P 8 -I{} aws s3 cp "$PUB/{}" "s3://$R2_BUCKET/tips/{}" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              --content-type image/webp --cache-control "public, max-age=31536000, immutable"
          fi
          list_bucket have2.txt
          still=$(comm -23 refs.txt have2.txt | wc -l)
          [ "$still" = 0 ] || { echo "still missing after upload: $still"; exit 1; }
          echo "every referenced image is in the bucket"
          # The public URLs must really serve it: the newest uploads, else a sample of all.
          { head -n 5 missing.txt; shuf -n 3 refs.txt; } | sort -u > probe.txt
          while read -r f; do
            ok=0; code=""
            for try in 1 2 3 4 5; do
              code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code} %{content_type}' "$R2_BASE/tips/$f" || true)
              if [ "$code" = "200 image/webp" ]; then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = 1 ] || { echo "public URL check failed for $f: $code"; exit 1; }
          done < probe.txt
          echo "public URL check passed"
          # Old same-site links (/tips/...) keep working; written to the built redirects only here.
          echo "/tips/* $R2_BASE/tips/:splat 301" >> "$DIST/_redirects"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/parts-shop
          command: >-
            pages deploy dist
            --project-name=kervan-parts-shop
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}

  smoke:
    name: Production smoke test
    needs: [deploy-heat-treatment, deploy-breaker-parts, deploy-parts-shop]
    # Only after a production deploy (main), and only if no deploy failed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Smoke probe (GET/OPTIONS only)
        run: bash .github/scripts/smoke.sh
