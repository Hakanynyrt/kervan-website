name: Uptime

# Probes the three production sites and the RFQ endpoint (GET/OPTIONS only — see
# .github/scripts/smoke.sh). A failed run emails the repo owner. The schedule asks for
# every 15 minutes, but GitHub cron is best-effort: in November 2026 the runs came 4 to
# 8 hours apart. It is also disabled after 60 days without repo activity. So this is a
# periodic deep check, not a downtime alarm; an outside monitor is needed for that.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Smoke probe
        run: bash .github/scripts/smoke.sh
