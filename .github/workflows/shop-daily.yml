name: Shop daily rebuild

# Rebuild the shop every morning (Istanbul 06:47) so the catalogue stays current. The TRY prices
# use the week's CBRT USD selling rate (the ISO week's Monday bulletin, scripts/fx.ts). TCMB
# publishes it at about 15:30 Istanbul, so until then Monday keeps the previous week's rate; the
# extra Monday 16:07 run switches to the new week's rate the same afternoon, the one change of the
# week. Manual runs work too.
on:
  schedule:
    - cron: '47 3 * * *'
    - cron: '7 13 * * 1'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Redeploy the shop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main -f app=parts-shop
