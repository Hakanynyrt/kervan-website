name: Shop daily rebuild

# Rebuild the shop every morning (Istanbul 06:47) so the catalogue stays current. The TRY prices
# use the week's CBRT USD selling rate (the ISO week's Monday bulletin, scripts/fx.ts), so the
# rate itself changes once a week. Manual runs work too.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Redeploy the shop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main -f app=parts-shop
