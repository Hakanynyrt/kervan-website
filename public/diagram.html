<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Breaker Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function Diagram() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).diagram;
      const [active, setActive] = useState('piston');
      const cur = p.parts.find(x => x.id === active);

      const HS = (id, props) => (
        <path
          className={\`diag-hot \${active===id?'active':''}\`}
          onClick={() => setActive(id)}
          {...props}
        />
      );

      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="diag-wrap">
                <div className="diag-svg">
                  <div className="diag-svg__title">
                    <span><b>●</b> EXPLODED VIEW · HB20G CLASS</span>
                    <span>KVN-DWG-EXP-01</span>
                  </div>
                  <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
                    <defs>
                      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stopColor="#1A1E26"/>
                        <stop offset="0.5" stopColor="#3B424F"/>
                        <stop offset="1" stopColor="#1A1E26"/>
                      </linearGradient>
                    </defs>

                    {/* Front head */}
                    <g transform="translate(200,50)">
                      <path d="M-70,0 L70,0 L55,70 L-55,70 Z" fill="url(#metal)" stroke="#6B7280" strokeWidth="1"/>
                      {HS('head', { d:"M-70,0 L70,0 L55,70 L-55,70 Z" })}
                      <text x="90" y="35" className={active==='head'?'diag-label active':'diag-label'}>HEAD · HED-11</text>
                    </g>

                    {/* Upper bushing */}
                    <g transform="translate(200,140)">
                      <rect x="-45" y="-10" width="90" height="20" fill="url(#metal)" stroke="#6B7280"/>
                      {HS('bush-u', { d:"M-45,-10 L45,-10 L45,10 L-45,10 Z" })}
                      <text x="60" y="4" className={active==='bush-u'?'diag-label active':'diag-label'}>UPPER BUSH · BSH-09-U</text>
                    </g>

                    {/* Bolts (left + right) */}
                    <g transform="translate(120,240)">
                      <rect x="-8" y="-90" width="16" height="180" fill="url(#metal)" stroke="#6B7280"/>
                      {HS('bolt', { d:"M-8,-90 L8,-90 L8,90 L-8,90 Z" })}
                    </g>
                    <g transform="translate(280,240)">
                      <rect x="-8" y="-90" width="16" height="180" fill="url(#metal)" stroke="#6B7280"/>
                      {HS('bolt', { d:"M-8,-90 L8,-90 L8,90 L-8,90 Z" })}
                      <text x="18" y="0" className={active==='bolt'?'diag-label active':'diag-label'}>BOLT · BLT-23</text>
                    </g>

                    {/* Piston */}
                    <g transform="translate(200,260)">
                      <rect x="-28" y="-70" width="56" height="140" fill="url(#metal)" stroke="#6B7280" strokeWidth="1.2"/>
                      <rect x="-28" y="-60" width="56" height="4" fill="#6B7280" opacity="0.5"/>
                      <rect x="-28" y="60" width="56" height="4" fill="#6B7280" opacity="0.5"/>
                      {HS('piston', { d:"M-28,-70 L28,-70 L28,70 L-28,70 Z" })}
                      <text x="42" y="0" className={active==='piston'?'diag-label active':'diag-label'}>PISTON · PST-17</text>
                    </g>

                    {/* Lower bushing */}
                    <g transform="translate(200,380)">
                      <rect x="-45" y="-10" width="90" height="20" fill="url(#metal)" stroke="#6B7280"/>
                      {HS('bush-l', { d:"M-45,-10 L45,-10 L45,10 L-45,10 Z" })}
                      <text x="60" y="4" className={active==='bush-l'?'diag-label active':'diag-label'}>LOWER BUSH · BSH-09-L</text>
                    </g>

                    {/* Chisel */}
                    <g transform="translate(200,500)">
                      <rect x="-18" y="-90" width="36" height="130" fill="url(#metal)" stroke="#6B7280" strokeWidth="1.2"/>
                      <polygon points="-18,40 18,40 0,70" fill="url(#metal)" stroke="#6B7280"/>
                      {HS('chisel', { d:"M-18,-90 L18,-90 L18,40 L0,70 L-18,40 Z" })}
                      <text x="32" y="0" className={active==='chisel'?'diag-label active':'diag-label'}>CHISEL · CHS-42</text>
                    </g>

                    {/* connection lines */}
                    <line x1="200" y1="120" x2="200" y2="130" stroke="rgba(232,120,26,0.4)" strokeWidth="0.8" strokeDasharray="2 2"/>
                    <line x1="200" y1="150" x2="200" y2="190" stroke="rgba(232,120,26,0.4)" strokeWidth="0.8" strokeDasharray="2 2"/>
                    <line x1="200" y1="330" x2="200" y2="370" stroke="rgba(232,120,26,0.4)" strokeWidth="0.8" strokeDasharray="2 2"/>
                    <line x1="200" y1="390" x2="200" y2="410" stroke="rgba(232,120,26,0.4)" strokeWidth="0.8" strokeDasharray="2 2"/>
                  </svg>
                  <div className="diag-svg__bot">
                    <span>SCALE 1:10</span>
                    <span>REV 00</span>
                  </div>
                </div>

                <div className="diag-panel">
                  <div className="diag-panel__eyebrow">● REF {cur.ref}</div>
                  <h3 className="diag-panel__title">{cur.title}</h3>
                  <p className="diag-panel__body">{cur.desc}</p>
                  <div className="diag-panel__specs">
                    {cur.specs.map(([k,v], i) => (
                      <div key={i} className="diag-panel__row">
                        <b>{k}</b>
                        <span>{v}</span>
                      </div>
                    ))}
                  </div>
                  <a href={\`index.html?lang=\${lang}#contact\`} className="btn-primary" style={{width:'100%', justifyContent:'center'}}>{p.askQuote}</a>
                </div>
              </div>
            </div>
          </section>
          <Footer t={t}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Diagram/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
