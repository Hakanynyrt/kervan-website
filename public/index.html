<body>

<!-- Cinematic intro — runs immediately, no React dependency -->
<script src="intro.js"></script>

<!-- Three.js scene — fixed behind all content -->
<script type="module" src="scene.js"></script>

<!-- Scroll hint -->
<div class="scroll-hint" id="scrollHint">Scroll</div>
<script>
  addEventListener('scroll', () => {
    const h = document.getElementById('scrollHint');
    if (h && window.scrollY > 120) h.classList.add('hide');
  }, { passive: true });
</script>

<!-- React app mount point -->
<div id="root"></div>

<!-- React 18 + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Fetch + compile JSX, then mount -->
<script>
(async function () {
  try {
    const [dict, comps] = await Promise.all([
      fetch('dict.jsx').then(r => { if (!r.ok) throw new Error('dict'); return r.text(); }),
      fetch('components.jsx').then(r => { if (!r.ok) throw new Error('comps'); return r.text(); }),
    ]);

    const app = `
      function App() {
        const [lang, setLang] = window.useLang();
        const t = window.DICT[lang] || window.DICT.en;
        return (
          <>
            <Nav lang={lang} setLang={setLang} t={t}/>
            <Hero t={t}/>
            <Ticker t={t}/>
            <Parts t={t}/>
            <OrbitSection t={t}/>
            <Furnace t={t}/>
            <Process t={t}/>
            <Meters t={t}/>
            <RFQ t={t}/>
            <Footer t={t}/>
            <WAFloat lang={lang}/>
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    `;

    const bundle = dict + '\n' + comps + '\n' + app;
    const compiled = Babel.transform(bundle, { presets: ['react'] }).code;
    const s = document.createElement('script');
    s.textContent = compiled;
    document.body.appendChild(s);
  } catch (err) {
    console.error('[kervanheat] Failed to load app:', err);
    // Minimal fallback: show contact info
    document.getElementById('root').innerHTML =
      '<div style="padding:40px;color:#F5F6F8;font-family:system-ui">' +
      '<h1 style="margin:0 0 16px">Kervan Heat</h1>' +
      '<p>+90 531 669 37 34 · <a href="mailto:info@kervanheat.com" style="color:#E8781A">info@kervanheat.com</a></p>' +
      '</div>';
  }
})();
</script>

</body>
