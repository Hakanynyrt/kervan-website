<script>
// Fetch + transpile + run JSX files in strict order (avoids Babel standalone's async race on multiple src)
(async function(){
  const files = ['dict.jsx', 'components.jsx'];
  for (const f of files) {
    const src = await fetch(f).then(r => r.text());
    const out = Babel.transform(src, { presets: ['react'] }).code;

    s.textContent = out;
    document.body.appendChild(s);
  }
  const app = Babel.transform(`
    function App() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;

          <Parts t={t}/>
          <OrbitSection t={t}/>
          <Furnace t={t}/>
          <Process t={t}/>
          <Meters t={t}/>
          <RFQ t={t}/>
          <Footer t={t}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  `, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = app;
  document.body.appendChild(s);
})();
