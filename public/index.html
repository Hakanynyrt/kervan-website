<style>
  /* Chisel lives in a fixed top-right badge — content is never asked to
     make room for it. Below 1100px the content takes the whole width and
     the badge hides. */
  #scene-root {
    position: fixed;
    top: 90px;
    right: 24px;
    width: 380px;
    height: 380px;

  }
  #scene-root canvas {

    width: 100% !important;

  }
  #root { position: relative; z-index: 1; }
  body  { background: #FAFAF7; }
  @media (max-width: 1100px) { #scene-root { display: none; } }
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Kervan Heat Treatment",

<body>

<div id="scene-root"></div>
<script type="module" src="scene.js?v=16"></script>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script>
(async function () {
  try {
    const [dict, comps] = await Promise.all([
      fetch('dict.jsx').then(r => { if (!r.ok) throw new Error('dict'); return r.text(); }),
      fetch('components.jsx').then(r => { if (!r.ok) throw new Error('comps'); return r.text(); }),
    ]);

    const app = `
      function App() {
        const [lang, setLang] = window.useLang();
        const t = window.DICT[lang] || window.DICT.en;
        return (
          <>
            <Nav lang={lang} setLang={setLang} t={t}/>
            <Hero t={t}/>
            <Products t={t}/>
            <Craft t={t}/>
            <Industries t={t}/>
            <Contact t={t}/>
            <Footer t={t}/>
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    `;

    const bundle = dict + '\n' + comps + '\n' + app;
    const compiled = Babel.transform(bundle, { presets: ['react'] }).code;
    const s = document.createElement('script');
    s.textContent = compiled;
    document.body.appendChild(s);

    // Scroll reveal — observe everything tagged .reveal or .reveal-stagger.
    // React renders asynchronously, so re-sweep until all nodes are picked up.
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      }
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });

    const SEEN = new WeakSet();
    function sweep() {
      document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => {
        if (!SEEN.has(el)) { SEEN.add(el); io.observe(el); }
      });
    }
    sweep();
    const revIv = setInterval(sweep, 150);
    setTimeout(() => clearInterval(revIv), 8000);
  } catch (err) {
    console.error('[kervanheat] Failed to load app:', err);
    document.getElementById('root').innerHTML =
      '<div style="padding:40px;font-family:system-ui">' +
      '<h1 style="margin:0 0 16px">Kervan Heat</h1>' +
      '<p>+90 531 669 37 34 · <a href="mailto:info@kervanheat.com" style="color:#E8781A">info@kervanheat.com</a></p>' +
      '</div>';
  }
})();
</script>

</body>
