<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — About</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="intro.css"/>
<link rel="stylesheet" href="pages.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://kervanheat.com/"/>
<meta property="og:title" content="Kervan Heat — Hidrolik kırıcı parçaları"/>
<meta property="og:description" content="Keski, piston, burç, cıvata. 40+ marka uyumlu. Kendi fırınımız. Kartepe, Kocaeli."/>
<meta property="og:image" content="https://kervanheat.com/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://kervanheat.com/og.png"/>
<link rel="canonical" href="https://kervanheat.com/about.html"/>
<meta name="description" content="Kervan Heat Treatment — Kartepe Kocaeli'de hidrolik kırıcı parçası ve ısıl işlem üreten aile şirketi."/>
<link rel="alternate" hreflang="tr" href="https://kervanheat.com/about.html?lang=tr"/>
<link rel="alternate" hreflang="en" href="https://kervanheat.com/about.html?lang=en"/>
<link rel="alternate" hreflang="de" href="https://kervanheat.com/about.html?lang=de"/>
<link rel="alternate" hreflang="ru" href="https://kervanheat.com/about.html?lang=ru"/>
<link rel="alternate" hreflang="x-default" href="https://kervanheat.com/about.html"/>
</head>
<body>
<script src="intro.js"></script>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function About() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).about;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="bio-grid">
                <div className="bio-photo">
                  <div className="bio-photo__title">
                    <span><b>●</b> {p.photoT}</span>
                    <span>01/04</span>
                  </div>
                  <div className="bio-photo__body">
                    <div className="bio-photo__silhouette"/>
                  </div>
                  <div className="bio-photo__bot">
                    <span>{p.photoS}</span>
                    <span>KVN-PHOTO-001</span>
                  </div>
                </div>
                <div>
                  <div className="bio-stats">
                    {p.stats.map(s => (
                      <div key={s.l} className="bio-stat">
                        <span className="bio-stat__l">{s.l}</span>
                        <span className="bio-stat__v">
                          {s.v.includes(' ') ? <>{s.v.split(' ')[0]} <em>{s.v.split(' ').slice(1).join(' ')}</em></> : s.v}
                        </span>
                      </div>
                    ))}
                  </div>
                  {p.story.map((s, i) => (
                    <div key={i} style={{marginBottom:24}}>
                      <h4 style={{fontFamily:'var(--f-mono)', fontSize:10, letterSpacing:'0.22em', color:'var(--brand)', margin:'0 0 8px', fontWeight:500}}>{s.h.toUpperCase()}</h4>
                      <p style={{color:'var(--t-2)', fontSize:15, lineHeight:1.6, margin:0}}>{s.p}</p>
                    </div>
                  ))}
                </div>
              </div>

              <blockquote className="bio-quote">
                {p.quote}
                <span className="bio-quote__attrib">— {p.quoteBy}</span>
              </blockquote>

              <h2 style={{fontFamily:'var(--f-head)', fontWeight:600, fontSize:36, letterSpacing:'-0.02em', margin:'64px 0 8px'}}>
                {lang==='tr' ? 'Kilometre ' : 'Mile'}<em style={{fontStyle:'normal', background:'linear-gradient(90deg, var(--brand-hi), var(--brand))', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent'}}>{lang==='tr' ? 'taşları.' : 'stones.'}</em>
              </h2>

              <div className="timeline">
                {p.timeline.map(row => (
                  <div key={row.y} className="timeline__row">
                    <div className="timeline__year">{row.y}</div>
                    <div>
                      <div className="timeline__title">{row.h}</div>
                      <div className="timeline__desc">{row.d}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
          <Footer t={t}/>
          <WAFloat lang={lang}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<About/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
