<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://kervanheat.com/"/>
<meta property="og:title" content="Kervan Heat — Hidrolik kırıcı parçaları"/>
<meta property="og:description" content="Keski, piston, burç, cıvata. 40+ marka uyumlu. EN 10204 3.1 sertifikalı. Kartepe, Kocaeli."/>
<meta property="og:image" content="https://kervanheat.com/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://kervanheat.com/og.png"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function Blog() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).blog;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="blog-list">
                {p.posts.map((post, i) => (
                  <a key={i} className="blog-card" href={\`post.html?slug=\${post.slug}&lang=\${lang}\`}>
                    <div className="blog-card__meta">
                      <span><b>●</b> {post.cat}</span>
                      <span>{post.date} · {post.read}</span>
                    </div>
                    <h3 className="blog-card__title">{post.title}</h3>
                    <p className="blog-card__dek">{post.dek}</p>
                    <div className="blog-card__more">{lang==='tr'?'DEVAMINI OKU':'READ MORE'} →</div>
                  </a>
                ))}
              </div>
            </div>
          </section>
          <Footer t={t}/>
          <WAFloat lang={lang}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Blog/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
