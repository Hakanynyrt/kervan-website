<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://kervanheat.com/"/>
<meta property="og:title" content="Kervan Heat — Hidrolik kırıcı parçaları"/>
<meta property="og:description" content="Keski, piston, burç, cıvata. 40+ marka uyumlu. EN 10204 3.1 sertifikalı. Kartepe, Kocaeli."/>
<meta property="og:image" content="https://kervanheat.com/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://kervanheat.com/og.png"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function Cases() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).cases;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              {p.items.map((c, i) => (
                <div key={i} className="case">
                  <div className="case__top">
                    {c.top.map(([k,v], j) => (
                      <div key={j} className="case__top__cell">
                        <b>{k}</b>
                        <span className={j===0?'orange':''}>{v}</span>
                      </div>
                    ))}
                  </div>
                  <div className="case__body">
                    <div className="case__copy">
                      <h3 className="case__title">{c.title}</h3>
                      <p className="case__prose">{c.prose}</p>
                      <blockquote className="case__quote">
                        {c.quote}
                        <span className="case__quote__attrib">— {c.quoteBy}</span>
                      </blockquote>
                    </div>
                    <div className="case__results">
                      <h6>● {lang==='tr' ? 'ÖLÇÜLEN SONUÇ' : 'MEASURED RESULT'}</h6>
                      {c.res.map(([v,l], j) => (
                        <div key={j} className="case__results__row">
                          <b>{v}</b>
                          <span>{l}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              ))}

              <div style={{marginTop:64, padding:'48px 40px', border:'1px solid var(--line-2)', background:'linear-gradient(180deg, var(--bg-1), transparent)', display:'flex', justifyContent:'space-between', alignItems:'center', gap:24, flexWrap:'wrap'}}>
                <div>
                  <div style={{fontFamily:'var(--f-mono)', fontSize:10, letterSpacing:'0.22em', color:'var(--brand)', marginBottom:10}}>● {lang==='tr'?'SİZDE DE İŞ VAR MI?':'YOUR TURN?'}</div>
                  <h3 style={{fontFamily:'var(--f-head)', fontSize:28, fontWeight:600, letterSpacing:'-0.02em', color:'var(--t-1)', margin:0}}>{lang==='tr'?'Benzer iş başlatalım.':'Let\\'s start a similar job.'}</h3>
                </div>
                <a href={\`index.html?lang=\${lang}#contact\`} className="btn-primary">{lang==='tr'?'Teklif Al':'Get a Quote'} <span>→</span></a>
              </div>
            </div>
          </section>
          <Footer t={t}/>
          <WAFloat lang={lang}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Cases/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
