<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://kervanheat.com/"/>
<meta property="og:title" content="Kervan Heat — Hidrolik kırıcı parçaları"/>
<meta property="og:description" content="Keski, piston, burç, cıvata. 40+ marka uyumlu. EN 10204 3.1 sertifikalı. Kartepe, Kocaeli."/>
<meta property="og:image" content="https://kervanheat.com/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://kervanheat.com/og.png"/>
<link rel="canonical" href="https://kervanheat.com/certs.html"/>
<meta name="description" content="EN 10204 3.1 malzeme sertifikası, ISO 9001 kalite, CE uyumluluğu — Kervan Heat'in tüm belgeleri."/>
<link rel="alternate" hreflang="tr" href="https://kervanheat.com/certs.html?lang=tr"/>
<link rel="alternate" hreflang="en" href="https://kervanheat.com/certs.html?lang=en"/>
<link rel="alternate" hreflang="de" href="https://kervanheat.com/certs.html?lang=de"/>
<link rel="alternate" hreflang="ru" href="https://kervanheat.com/certs.html?lang=ru"/>
<link rel="alternate" hreflang="x-default" href="https://kervanheat.com/certs.html"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function Certs() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).certs;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="cert-grid">
                {p.items.map((c, i) => (
                  <div key={i} className="cert-card">
                    <div className="cert-card__num">● {c.num}</div>
                    <h3 className="cert-card__title">{c.title}</h3>
                    <p className="cert-card__body">{c.body}</p>
                    <div className="cert-card__stamp">{c.stamp.split('\\n').map((l,j)=><div key={j}>{l}</div>)}</div>
                    <div className="cert-card__actions">
                      <button className="btn-secondary" style={{padding:'10px 16px', fontSize:10}} onClick={()=>alert(lang==='tr'?'PDF yakında — örnek belge iletişim yoluyla talep edilebilir.':'PDF coming soon — sample available on request.')}>{p.download}</button>
                      <button className="btn-secondary" style={{padding:'10px 16px', fontSize:10, background:'transparent'}} onClick={()=>alert(lang==='tr'?'Örnek belge için iletişim formundan ulaşın.':'Use the contact form to request a sample.')}>{p.sample}</button>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{padding:'40px', border:'1px solid var(--line)', background:'var(--bg-1)'}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:32}}>
                  <div>
                    <div style={{fontFamily:'var(--f-mono)', fontSize:10, letterSpacing:'0.22em', color:'var(--brand)', marginBottom:12}}>● {lang==='tr'?'HER SİPARİŞE DAHİL':'INCLUDED WITH EVERY ORDER'}</div>
                    <h3 style={{fontFamily:'var(--f-head)', fontSize:24, fontWeight:600, letterSpacing:'-0.02em', color:'var(--t-1)', margin:'0 0 14px'}}>{lang==='tr'?'Belgelerle gelir, iddialarla değil.':'Comes with paper, not promises.'}</h3>
                    <p style={{color:'var(--t-2)', fontSize:14, lineHeight:1.6, margin:0}}>{lang==='tr'?'Her sevkiyat: EN 10204 3.1 sertifikası, Rockwell raporu, boyut kontrolü, ambalaj listesi.':'Every shipment: EN 10204 3.1 cert, Rockwell report, dim check, packing list.'}</p>
                  </div>
                  <div style={{borderLeft:'1px solid var(--line)', paddingLeft:32}}>
                    <ul style={{listStyle:'none', padding:0, margin:0, color:'var(--t-2)', fontSize:13, lineHeight:2}}>
                      <li>✓ {lang==='tr'?'Malzeme kimyası — her parti':'Material chemistry — per lot'}</li>
                      <li>✓ {lang==='tr'?'Sertlik testi — her parça':'Hardness — per piece'}</li>
                      <li>✓ {lang==='tr'?'Boyut kontrolü — örnek':'Dim check — sampled'}</li>
                      <li>✓ {lang==='tr'?'Isıl işlem profili':'Heat-treat profile'}</li>
                      <li>✓ {lang==='tr'?'AB için DoC':'DoC for EU'}</li>
                      <li>✓ {lang==='tr'?'İzlenebilirlik zinciri':'Traceability chain'}</li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <Footer t={t}/>
          <WAFloat lang={lang}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Certs/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
