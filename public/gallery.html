<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://kervanheat.com/"/>
<meta property="og:title" content="Kervan Heat — Hidrolik kırıcı parçaları"/>
<meta property="og:description" content="Keski, piston, burç, cıvata. 40+ marka uyumlu. EN 10204 3.1 sertifikalı. Kartepe, Kocaeli."/>
<meta property="og:image" content="https://kervanheat.com/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://kervanheat.com/og.png"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    // Engineering-style SVG illustrations — each kind draws a scene on the shop floor
    function GalSVG({ kind }) {
      const cx = { stroke:'#E8781A', fill:'none', strokeWidth:1.2 };
      const dx = { stroke:'rgba(168,173,184,0.35)', fill:'none', strokeWidth:0.8 };
      const m  = { stroke:'rgba(107,114,128,0.55)', fill:'url(#steel)', strokeWidth:1 };
      const defs = (
        <defs>
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor="#2A2F3A"/><stop offset="0.5" stopColor="#3B424F"/><stop offset="1" stopColor="#1A1E26"/>
          </linearGradient>
          <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stopColor="#3B2616"/><stop offset="0.5" stopColor="#E8781A"/><stop offset="1" stopColor="#F2B457"/>
          </linearGradient>
          <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(232,120,26,0.3)" strokeWidth="1"/>
          </pattern>
        </defs>
      );
      if (kind === 'cnc') return (
        <svg viewBox="0 0 400 225" className="gal-svg">{defs}
          <rect x="0" y="150" width="400" height="75" fill="#0F1114"/>
          <rect x="30" y="100" width="340" height="60" fill="#1A1E26" stroke="#3B424F"/>
          <rect x="50" y="115" width="300" height="35" fill="#0A0B0D"/>
          <g transform="translate(200,132)">
            <rect x="-80" y="-4" width="160" height="8" {...m}/>
            <rect x="-82" y="-10" width="4" height="20" {...m}/>
            <rect x="78" y="-10" width="4" height="20" {...m}/>
            <rect x="-20" y="-15" width="40" height="10" fill="#3B424F" stroke="#6B7280"/>
            <line x1="0" y1="-25" x2="0" y2="-12" stroke="#E8781A" strokeWidth="2"/>
            <circle cx="0" cy="-30" r="6" fill="#E8781A" opacity="0.5"/>
          </g>
          <line x1="40" y1="80" x2="360" y2="80" {...dx} strokeDasharray="4 2"/>
          <g {...cx}>
            <line x1="50" y1="75" x2="350" y2="75"/>
            <polygon points="50,75 56,72 56,78" fill="#E8781A"/>
            <polygon points="350,75 344,72 344,78" fill="#E8781A"/>
          </g>
          <text x="200" y="68" fontFamily="JetBrains Mono" fontSize="8" fill="#E8781A" textAnchor="middle" letterSpacing="1">L · 1400 mm · ±0.01</text>
          <text x="30" y="20" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="2">CNC · 4-AXIS LATHE</text>
          <text x="30" y="36" fontFamily="Space Grotesk" fontSize="14" fill="#E9EAEC" fontWeight="600">PISTON · PST-17-100</text>
          {[...Array(40)].map((_,i)=><line key={i} x1={10+i*10} y1="195" x2={10+i*10} y2={i%5===0?185:190} stroke="rgba(168,173,184,0.3)" strokeWidth="0.5"/>)}
        </svg>
      );
      if (kind === 'furnace') return (
        <svg viewBox="0 0 250 350" className="gal-svg">{defs}
          <rect x="20" y="80" width="210" height="230" fill="#1A1E26" stroke="#3B424F"/>
          <rect x="40" y="110" width="170" height="170" fill="url(#hot)"/>
          <rect x="40" y="110" width="170" height="170" fill="url(#hatch)"/>
          {[...Array(6)].map((_,i)=><rect key={i} x="55" y={125+i*24} width="140" height="4" fill="#0F1114" opacity="0.8"/>)}
          <circle cx="125" cy="300" r="3" fill="#E8781A"/>
          <text x="35" y="100" fontFamily="JetBrains Mono" fontSize="9" fill="#E8781A" letterSpacing="1.5">870 °C</text>
          <text x="170" y="100" fontFamily="JetBrains Mono" fontSize="9" fill="#A8ADB8" letterSpacing="1">T · HARDENING</text>
          <g transform="translate(20,30)">
            <rect x="0" y="0" width="210" height="28" fill="#0F1114" stroke="#3B424F"/>
            <text x="12" y="18" fontFamily="JetBrains Mono" fontSize="10" fill="#E8781A" letterSpacing="2">T = 870.00 °C</text>
            <rect x="150" y="8" width="50" height="12" fill="#0A0B0D"/>
            <rect x="152" y="10" width="46" height="8" fill="#E8781A" opacity="0.8"/>
          </g>
        </svg>
      );
      if (kind === 'grind') return (
        <svg viewBox="0 0 250 350" className="gal-svg">{defs}
          <rect x="0" y="280" width="250" height="70" fill="#0F1114"/>
          <g transform="translate(125,230)">
            <ellipse cx="0" cy="0" rx="70" ry="18" fill="#2A2F3A" stroke="#6B7280" strokeWidth="1.5"/>
            <ellipse cx="0" cy="-4" rx="70" ry="18" fill="url(#steel)" stroke="#6B7280" strokeWidth="1.5"/>
            <circle cx="0" cy="-4" r="3" fill="#E8781A"/>
            <line x1="-68" y1="-4" x2="68" y2="-4" stroke="rgba(255,255,255,0.12)" strokeDasharray="4 2"/>
            {[...Array(20)].map((_,i)=><line key={i} x1={-65+i*7} y1="-18" x2={-63+i*7} y2="-22" stroke="#E8781A" strokeWidth="0.5" opacity="0.6"/>)}
          </g>
          <g transform="translate(125,140)">
            <rect x="-45" y="-30" width="90" height="60" fill="#3B424F" stroke="#6B7280"/>
            <circle cx="0" cy="0" r="24" fill="#1A1E26" stroke="#6B7280" strokeWidth="1.5"/>
            <circle cx="0" cy="0" r="8" fill="#0A0B0D"/>
          </g>
          <text x="20" y="30" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="2">CYLINDRICAL GRIND</text>
          <text x="20" y="48" fontFamily="Space Grotesk" fontSize="14" fill="#E9EAEC" fontWeight="600">Ra · 0.4 μm</text>
          <g transform="translate(0,80)" stroke="#E8781A" fill="none" strokeWidth="1">
            <line x1="30" y1="130" x2="220" y2="130"/>
            <polygon points="30,130 36,127 36,133" fill="#E8781A"/>
            <polygon points="220,130 214,127 214,133" fill="#E8781A"/>
          </g>
        </svg>
      );
      if (kind === 'chisel') return (
        <svg viewBox="0 0 300 200" className="gal-svg">{defs}
          <rect x="0" y="160" width="300" height="40" fill="#0F1114"/>
          {[0,1,2,3,4,5,6].map(i => (
            <g key={i} transform={\`translate(\${30+i*38},30)\`}>
              <rect x="-8" y="0" width="16" height="100" {...m}/>
              <polygon points="-8,100 8,100 6,125 -6,125" {...m}/>
              <polygon points="-6,125 6,125 0,135" {...m}/>
            </g>
          ))}
          <text x="20" y="20" fontFamily="JetBrains Mono" fontSize="8" fill="#E8781A" letterSpacing="2">QTY · 07 / 500</text>
          <text x="180" y="20" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="1">Ø 80 × 1650 · HB20G</text>
          <line x1="20" y1="165" x2="280" y2="165" stroke="rgba(168,173,184,0.3)"/>
        </svg>
      );
      if (kind === 'qc') return (
        <svg viewBox="0 0 300 200" className="gal-svg">{defs}
          <rect x="20" y="20" width="260" height="160" fill="#0F1114" stroke="#3B424F"/>
          <g transform="translate(100,100)">
            <circle cx="0" cy="0" r="55" fill="none" stroke="#3B424F" strokeWidth="2"/>
            <circle cx="0" cy="0" r="55" fill="none" stroke="#E8781A" strokeWidth="2" strokeDasharray="200 500" transform="rotate(-90)"/>
            <text x="0" y="5" fontFamily="JetBrains Mono" fontSize="22" fill="#E8781A" textAnchor="middle" fontWeight="600">50</text>
            <text x="0" y="20" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" textAnchor="middle" letterSpacing="2">HRC</text>
          </g>
          <g transform="translate(190,45)">
            <rect x="0" y="0" width="80" height="12" fill="#0A0B0D" stroke="#3B424F"/>
            <rect x="2" y="2" width={50} height="8" fill="#E8781A"/>
            <text x="0" y="26" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="1">READING 01</text>
          </g>
          <g transform="translate(190,85)">
            <rect x="0" y="0" width="80" height="12" fill="#0A0B0D" stroke="#3B424F"/>
            <rect x="2" y="2" width={54} height="8" fill="#E8781A"/>
            <text x="0" y="26" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="1">READING 02</text>
          </g>
          <g transform="translate(190,125)">
            <rect x="0" y="0" width="80" height="12" fill="#0A0B0D" stroke="#3B424F"/>
            <rect x="2" y="2" width={48} height="8" fill="#E8781A"/>
            <text x="0" y="26" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="1">READING 03</text>
          </g>
        </svg>
      );
      if (kind === 'pack') return (
        <svg viewBox="0 0 300 200" className="gal-svg">{defs}
          <rect x="0" y="150" width="300" height="50" fill="#0F1114"/>
          <rect x="40" y="50" width="90" height="100" fill="#2A1A10" stroke="#4A3020" strokeWidth="1.5"/>
          {[1,2,3].map(i => <line key={i} x1="40" y1={50+i*25} x2="130" y2={50+i*25} stroke="#4A3020"/>)}
          <rect x="155" y="70" width="90" height="80" fill="#2A1A10" stroke="#4A3020" strokeWidth="1.5"/>
          {[1,2].map(i => <line key={i} x1="155" y1={70+i*26} x2="245" y2={70+i*26} stroke="#4A3020"/>)}
          <rect x="50" y="60" width="70" height="8" fill="#0A0B0D"/>
          <text x="55" y="67" fontFamily="JetBrains Mono" fontSize="6" fill="#E8781A" letterSpacing="1">KVN-2026-00041</text>
          <text x="20" y="30" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="2">PACKING · READY</text>
        </svg>
      );
      if (kind === 'bar') return (
        <svg viewBox="0 0 250 350" className="gal-svg">{defs}
          <rect x="0" y="310" width="250" height="40" fill="#0F1114"/>
          {[0,1,2,3,4,5].map(i => (
            <g key={i} transform={\`translate(\${40+(i%2)*90},\${70+Math.floor(i/2)*80})\`}>
              <ellipse cx="0" cy="0" rx="28" ry="10" {...m}/>
              <rect x="-28" y="0" width="56" height="60" fill="url(#steel)" stroke="#6B7280"/>
              <ellipse cx="0" cy="60" rx="28" ry="10" {...m}/>
            </g>
          ))}
          <text x="20" y="40" fontFamily="JetBrains Mono" fontSize="8" fill="#E8781A" letterSpacing="2">BAR STOCK · 42CrMoA</text>
          <text x="20" y="56" fontFamily="JetBrains Mono" fontSize="8" fill="#A8ADB8" letterSpacing="1">Ø 80-150 · FORGED</text>
        </svg>
      );
      if (kind === 'forge') return (
        <svg viewBox="0 0 400 270" className="gal-svg">{defs}
          <rect x="0" y="220" width="400" height="50" fill="#0F1114"/>
          <g transform="translate(200,130)">
            <rect x="-140" y="70" width="280" height="30" fill="#1A1E26" stroke="#3B424F"/>
            <g>
              <rect x="-50" y="-30" width="100" height="30" fill="#2A2F3A" stroke="#6B7280"/>
              <rect x="-40" y="0" width="80" height="70" fill="url(#hot)" opacity="0.9"/>
              <rect x="-40" y="0" width="80" height="70" fill="url(#hatch)"/>
            </g>
            <rect x="-55" y="-55" width="110" height="30" fill="#2A2F3A" stroke="#6B7280"/>
            {[-40,-20,0,20,40].map(x => <rect key={x} x={x-5} y="-80" width="10" height="25" fill="#3B424F"/>)}
          </g>
          <text x="30" y="40" fontFamily="JetBrains Mono" fontSize="9" fill="#A8ADB8" letterSpacing="2">FORGE PRESS · 1250 °C</text>
          <text x="30" y="60" fontFamily="Space Grotesk" fontSize="18" fill="#E9EAEC" fontWeight="600">Bar → Pre-form</text>
          <g transform="translate(290,40)">
            <rect x="0" y="0" width="80" height="40" fill="#0F1114" stroke="#3B424F"/>
            <text x="40" y="20" fontFamily="JetBrains Mono" fontSize="18" fill="#E8781A" textAnchor="middle" fontWeight="600">1252</text>
            <text x="40" y="33" fontFamily="JetBrains Mono" fontSize="7" fill="#A8ADB8" textAnchor="middle" letterSpacing="1">T °C</text>
          </g>
        </svg>
      );
      if (kind === 'ship') return (
        <svg viewBox="0 0 250 350" className="gal-svg">{defs}
          <rect x="0" y="300" width="250" height="50" fill="#0F1114"/>
          <rect x="40" y="100" width="170" height="200" fill="#1A1E26" stroke="#3B424F" strokeWidth="2"/>
          <g stroke="#3B424F" strokeWidth="1">
            {[1,2,3,4].map(i=><line key={i} x1="40" y1={100+i*40} x2="210" y2={100+i*40}/>)}
            {[1,2,3].map(i=><line key={i} x1={40+i*42} y1="100" x2={40+i*42} y2="300"/>)}
          </g>
          <rect x="60" y="115" width="30" height="25" fill="#E8781A" opacity="0.8"/>
          <text x="75" y="132" fontFamily="JetBrains Mono" fontSize="6" fill="#0A0B0D" textAnchor="middle" fontWeight="600">DE</text>
          <text x="20" y="50" fontFamily="JetBrains Mono" fontSize="8" fill="#E8781A" letterSpacing="2">DISPATCH · 20+ CNTR</text>
          <text x="20" y="80" fontFamily="Space Grotesk" fontSize="13" fill="#E9EAEC" fontWeight="600">WORLDWIDE</text>
          <g transform="translate(40,260)">
            <text x="0" y="0" fontFamily="JetBrains Mono" fontSize="6" fill="#A8ADB8">KVN-2026-00041 · 400kg</text>
          </g>
        </svg>
      );
      return <svg className="gal-svg"/>;
    }

    function Gallery() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).gallery;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="gal-grid">
                {p.cells.map((c, i) => (
                  <div key={i} className={\`gal-cell w\${c.w} h\${c.h}\`}>
                    <div className="gal-cell__title">
                      <span><b>●</b> {c.t}</span>
                      <span>{c.s}</span>
                    </div>
                    <div className="gal-cell__body">
                      <GalSVG kind={c.kind}/>
                    </div>
                    <div className="gal-cell__bot">
                      <span>KVN-PHOTO-{String(i+1).padStart(3,'0')}</span>
                      <span className="orange">KARTEPE</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
          <Footer t={t}/>
          <WAFloat lang={lang}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Gallery/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
