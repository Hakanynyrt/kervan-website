<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kervan Heat — Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="kit.css"/>
<link rel="stylesheet" href="pages.css"/>
<style>
@media print {
  .nav, .foot, .btn-primary, .wa { display: none !important; }
  body { background: #fff; color: #000; }
  .page { padding-top: 20px; }
  .cat-table td, .cat-table th { color: #000 !important; }
  .cat-group__head h3, .page__head h1 { color: #000 !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
(async function(){
  const files = ['dict.jsx', 'components.jsx', 'pages-dict.jsx'];
  const sources = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
  const app = `
    function Catalog() {
      const [lang, setLang] = window.useLang();
      const t = window.DICT[lang] || window.DICT.en;
      const p = (window.PAGES_DICT[lang] || window.PAGES_DICT.en).catalog;
      return (
        <>
          <Nav lang={lang} setLang={setLang} t={t}/>
          <section className="page">
            <div className="wrap">
              <div className="page__crumbs">
                <a href={\`index.html?lang=\${lang}\`}>HOME</a>
                <span className="sep">/</span>
                <span className="active">{p.crumb.toUpperCase()}</span>
              </div>
              <div className="page__head">
                <h1>{p.h1a}<em>{p.h1b}</em></h1>
                <div className="page__head__meta"><b>●</b> {p.meta}</div>
              </div>
              <p className="page__lede">{p.lede}</p>

              <div className="cat-header">
                <div className="cat-header__cell"><b>{lang==='tr'?'PROJE':'PROJECT'}</b><span>KERVAN HEAT CAT-2026</span></div>
                <div className="cat-header__cell"><b>{lang==='tr'?'KOD':'CODE'}</b><span>KVN-CAT-2026</span></div>
                <div className="cat-header__cell"><b>{lang==='tr'?'REVIZYON':'REV'}</b><span>00 · 2026</span></div>
                <div className="cat-header__cell"><b>{lang==='tr'?'BOYUT':'SIZE'}</b><span>A4 · 3.2 MB</span></div>
              </div>

              <div style={{display:'flex', gap:12, marginBottom:40}}>
                <button className="btn-primary" onClick={()=>window.print()}>{lang==='tr'?'Yazdır':'Print'} <span>→</span></button>
                <button className="btn-secondary" onClick={()=>alert(lang==='tr'?'PDF yakında — şimdilik Yazdır → PDF olarak kaydet':'PDF coming — for now: Print → Save as PDF')}>{p.cta}</button>
              </div>

              {p.groups.map((g, gi) => (
                <div key={gi} className="cat-group">
                  <div className="cat-group__head">
                    <h3>{String(gi+1).padStart(2,'0')} · {g.name}</h3>
                    <span>{g.count}</span>
                  </div>
                  <table className="cat-table">
                    <thead>
                      <tr>{p.th.map(h => <th key={h}>{h}</th>)}</tr>
                    </thead>
                    <tbody>
                      {g.rows.map((r, ri) => (
                        <tr key={ri}>
                          {r.map((v, vi) => <td key={vi}>{v}</td>)}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}
            </div>
          </section>
          <Footer t={t}/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Catalog/>);
  `;
  const bundle = sources.join('\n') + '\n' + app;
  const out = Babel.transform(bundle, { presets: ['react'] }).code;
  const s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
